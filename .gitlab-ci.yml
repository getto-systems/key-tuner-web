stages:
    - test
    - bump_version
    - release

variables:
    TRELLIS_GIT_POST: https://trellis.getto.systems/git/post/1.5.2
    TRELLIS_CI_BUMP_VERSION: https://trellis.getto.systems/ci/bump-version/1.15.0
    TRELLIS_PSYCHER_GETTO: https://trellis.getto.systems/psycher/getto/2.7.2

test:
    stage: test
    only:
        refs:
            - schedules

    image: node:latest

    before_script:
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        - . "$HOME/.cargo/env"
        - npm ci
    script:
        - npm test

bump_version:
    stage: bump_version
    only:
        refs:
            - triggers
        variables:
            - $RELEASE

    image: node:latest

    variables:
        BUMP_SCRIPT: ".ci/bump-version.sh"

    before_script:
        - git config user.email admin@getto.systems
        - git config user.name getto
        - curl $TRELLIS_GIT_POST/setup.sh | sh -s -- ./vendor/getto-systems
        - export PATH=$PATH:./vendor/getto-systems/git-post/bin
    script:
        - curl $TRELLIS_CI_BUMP_VERSION/bump_version.sh | bash
        - curl $TRELLIS_CI_BUMP_VERSION/request.sh | bash -s -- ./.ci/bump-message.sh

release:
    stage: release
    only:
        refs:
            - release@getto-systems-base/projects/key-tuner
        changes:
            - .release-version
    except:
        refs:
            - triggers
            - schedules

    variables:
        BUMP_MAINT_REPO_FILE: ".ci/bump-maint-repo.txt"

    script:
        - curl $TRELLIS_CI_BUMP_VERSION/push_tags.sh | sh
