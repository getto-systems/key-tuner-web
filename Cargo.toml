[workspace]
members = [
    "crates/core",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["shun@getto.systems"]
license = "GPL-3.0"

[workspace.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Window",
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "console",
] }