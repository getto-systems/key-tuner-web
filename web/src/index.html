<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Tuner - パスワードジェネレーター</title>
  <meta name="description" content="安全なパスワードを生成するツール">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Key Tuner</h1>
      <p>安全なパスワードを生成するツール</p>
    </header>
    
    <main>
      <div class="password-container">
        <div id="password-output" class="password-output">パスワードがここに表示されます</div>
        <button id="copy-button" class="button">コピー</button>
      </div>
      
      <div class="controls">
        <div class="control-group">
          <label for="pass-phrase">パスフレーズ</label>
          <input type="text" id="pass-phrase" placeholder="あなたの秘密のフレーズを入力してください" value="default passphrase">
        </div>
        
        <div class="control-group">
          <label for="service-name">サービス名</label>
          <input type="text" id="service-name" placeholder="パスワードを使用するサービス名を入力してください" value="default service">
        </div>
        
        <div class="control-group">
          <label for="version">バージョン</label>
          <input type="text" id="version" placeholder="バージョン番号を入力してください" value="1">
        </div>
        
        <div class="control-group">
          <label for="password-mode">生成モード</label>
          <select id="password-mode">
            <option value="ex" selected>Ex: 大文字小文字数字記号を含む</option>
            <option value="full">Full: 大文字小文字数字を含む</option>
            <option value="short">Short: 小文字数字のみ</option>
          </select>
        </div>
        
        <div class="control-group">
          <label for="password-length">長さ: <span id="length-value">12</span></label>
          <input type="range" id="password-length" min="8" max="64" value="12">
        </div>
      </div>
      
      <button id="generate-button" class="button primary">パスワードを生成</button>
    </main>
    
    <footer>
      <p>&copy; since 2025 shun@getto.systems</p>
    </footer>
  </div>
  
  <script type="module" src="./js/index.js"></script>
</body>
</html>
