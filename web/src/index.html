<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Tuner - パスワードジェネレーター</title>
  <meta name="description" content="安全なパスワードを生成">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Key Tuner</h1>
      <p>安全なパスワードを生成</p>
    </header>
    
    <!-- 復帰不可能なエラーを表示するための要素 -->
    <div id="fatal-error" class="fatal-error">
      <div class="fatal-error-content">
        <h2>エラーが発生しました</h2>
        <p id="fatal-error-message">アプリケーションの初期化中にエラーが発生しました。</p>
        <p>ページを再読み込みしてみてください。問題が解決しない場合は、管理者にお問い合わせください。</p>
      </div>
    </div>
    
    <main>
      <div class="password-container">
        <div id="password-output" class="password-output">パスワードがここに表示されます</div>
        <button id="copy-button" class="button">コピー</button>
      </div>
      
      <div class="controls">
        <div class="control-group">
          <label for="pass-phrase">パスフレーズ</label>
          <input type="text" id="pass-phrase" placeholder="パスワード生成のベースとなる文字列" value="">
          <div id="pass-phrase-error" class="error-message"></div>
        </div>
        
        <div class="control-group">
          <label for="service-name">サービス名</label>
          <input type="text" id="service-name" placeholder="パスワードを使用するサービスの名前" value="">
          <div id="service-name-error" class="error-message"></div>
        </div>
        
        <div class="control-group">
          <label for="version">バージョン</label>
          <input type="text" id="version" placeholder="異なるバージョンのパスワードを生成する場合に入力" value="">
          <div id="version-error" class="error-message"></div>
        </div>
        
        <div class="control-group">
          <label>生成モード</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="password-mode-ex" name="password-mode" value="ex" checked>
              <label for="password-mode-ex">Ex: 大文字小文字数字記号を含む</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="password-mode-full" name="password-mode" value="full">
              <label for="password-mode-full">Full: 大文字小文字数字記号を含む</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="password-mode-short" name="password-mode" value="short">
              <label for="password-mode-short">Short: 小文字数字のみ</label>
            </div>
          </div>
          <div id="password-mode-error" class="error-message"></div>
        </div>
        
        <div class="control-group">
          <label for="password-length">長さ:</label>
          <input type="number" id="password-length" min="8" max="64" value="32">
          <div id="password-length-error" class="error-message"></div>
        </div>
      </div>
      
      <button id="generate-button" class="button primary">パスワードを生成</button>
    </main>
    
    <footer>
      <p>&copy; since 2025 shun@getto.systems</p>
    </footer>
  </div>
  
  <script type="module" src="./js/pages/index/main.ts"></script>
</body>
</html>
